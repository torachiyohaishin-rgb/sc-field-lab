<script>
'use strict';
const STORAGE_KEY='sc_field_lab_v2';
const AREAS=['通信・ネットワーク','Web・アプリ','攻撃と防御','調査・運用','認証・暗号','記述技術','その他'];
const ICONS={'通信・ネットワーク':'↔','Web・アプリ':'⌘','攻撃と防御':'◇','調査・運用':'▣','認証・暗号':'⌑','記述技術':'✎','その他':'●'};
const NAV=[['systems','◈','学習マップ'],['attacks','⚔','攻撃図鑑'],['glossary','Aᵇ','略語辞典'],['study','✎','定着演習'],['topics','▤','弱点リスト'],['exams','▥','過去問記録'],['home','▦','学習統計'],['settings','⚙','設定・保存']];
const seedTopics=[
['http-methods','HTTPのGET・POST・PUT','通信・ネットワーク',3,'R6秋 問3','HTTPメソッドとステータスを攻撃の流れに結び付けられない','GETは取得、POSTは処理依頼、PUTは指定資源の作成・置換。機密値をURLに含めるとログにも残り得る。','PUTで公開JSが置換 → ブラウザが悪意あるJSを実行 → GETのURLで情報が流出','更新可能な公開領域を狙い、不正スクリプトを配置する','不要なHTTPメソッドを禁止し、重要ファイルの改ざんを監視する','HTTPメソッド、対象パス、レスポンスコード、ログの記録項目を対応付ける'],
['session','Cookieとセッション固定攻撃','Web・アプリ',3,'R6秋 問4','セッションIDを隠すだけの対策を書いた','Cookieはブラウザが保持して送信するデータ。セッションIDはサーバ上のログイン状態と利用者を結び付ける識別子。ログイン成功時にIDを再発行する。','攻撃者が既知のセッションIDを被害者に使わせる → 被害者がログイン → 同じIDを悪用','既知のセッションIDを利用者に固定する','ログイン時にセッションIDを再生成し、旧IDを無効化する','攻撃者が既にIDを知っている場合は「隠す」だけでは防げない'],
['dns-record','権威DNS・CNAME・旧ドメイン','通信・ネットワーク',3,'R7春 問4','公開Webサーバと権威DNSの役割を混同','権威DNSはドメインの正式なレコードを管理する。CNAMEは別名の参照先を指定する。利用終了サービスを指すCNAMEは放置すると乗っ取られる場合がある。','サービスの契約終了 → CNAMEが残存 → 攻撃者が参照先を取得','利用されていない外部サービスの名前を再取得する','不要なCNAMEを権威DNSから削除し、資産棚卸しを行う','「どの装置」の「どのレコード」を変更するかを答案に書く'],
['tls-hsts','TLS・HTTPS・HSTS','通信・ネットワーク',3,'R6秋 問4 / R7秋 問3','TLSによる暗号化とHSTSの役割を混同','TLSは通信の機密性・完全性などを保護する。HSTSはブラウザにHTTPS接続を使わせ、HTTPへのダウングレードを防ぎやすくする。','HTTPアクセスを経由して安全な接続へ移る隙を狙う','利用者を暗号化されない接続に誘導する','HTTPSを適切に提供し、HSTSヘッダーを設定する','「通信が暗号化される」と「HTTPSで接続するよう強制」は異なる'],
['security-headers','MIME・nosniff・CSP','Web・アプリ',3,'R6秋 問4','X-Content-Type-OptionsとCSPを混同','X-Content-Type-Options: nosniffは指定MIME型に反する推測を抑制する。CSPはスクリプトの取得元・実行などを制御できる。','ブラウザのコンテンツ解釈や意図しないスクリプト実行を悪用','異なる種類のファイルを実行させる','MIME型を正しく返し、nosniffと適切なCSPを使う','ヘッダー名ごとの効果を正確に書く'],
['mail-auth','SPF・DKIM・DMARC','認証・暗号',3,'R6秋 問2','メーリングリストで認証失敗する仕組みが説明できない','SPFは送信元IPとエンベロープFrom等のドメイン、DKIMは署名、DMARCはヘッダーFromとの整合性を確認する。','転送やSubject編集でSPFやDKIMが失敗する場合がある','なりすましメールを正規に見せかける','送信元IPやDKIM署名、DMARCの整合性を設計する','SPFは送信IP／DKIMは署名されたヘッダーと本文の変更を考える'],
['smtp-whois','SMTPS・IPsec・WHOIS','通信・ネットワーク',2,'R6秋 問2 / R7春 問4','通信暗号化と登録情報検索の技術を取り違える','SMTPSはメール配送のTLSによる保護、IPsecはIP層で通信を保護、WHOISはドメイン名などの登録情報を調べるためのプロトコル・サービス。','役割の異なる技術を混同すると対策が成立しない','未管理ドメインや通信経路の盲点を探す','レイヤと用途から技術を選択する','何を調べる・何を暗号化するかから逆引きする'],
['web-js','HTML・DOM・フォーム・JavaScript','Web・アプリ',3,'R6秋 問3','submitイベントやpathname条件を読み違えた','フォームはname属性の値を送信する。DOMはブラウザ内の文書構造。addEventListenerはイベント発生時の処理を登録する。location.pathnameはURLのパス部分。','特定ページでフォーム内容を取得 → 外部へ送信','画面やイベント処理に悪意あるJavaScriptを挿入する','不正な変更を検知し、通信先を制限する','条件・発動イベント・取得データ・送信先を4点セットで読む'],
['xss','XSS・出力エスケープ','攻撃と防御',3,'R6秋 問3 / R7秋 問1','XSSの種類・実行条件の整理不足','XSSは本来データとして扱う値がブラウザにスクリプトとして解釈される問題。出力場所に適したエスケープや安全なDOM APIを使う。','不正な文字列がHTMLとして出力 → ブラウザでスクリプト実行','入力欄やURLを通じてスクリプトを埋め込む','文脈に合った出力エスケープと適切なCSPを行う','反射型・格納型・DOM型を区別する'],
['sqli','SQLインジェクション','攻撃と防御',3,'R6秋 問3 / R7春 問2','入力文字列とSQL構造の関係を説明しにくい','SQLiは入力値をSQL文の一部として連結してしまう問題。プレースホルダ付きのパラメータ化クエリでデータとして扱わせる。','入力値がSQLの命令として解釈 → 条件が変化する','検索条件を改変し、情報取得や改ざんを試みる','パラメータ化クエリと最小権限を利用する','WAFだけでなくアプリ側の根本対策を述べる'],
['attack-path','攻撃経路に対応した防御策','記述技術',3,'R6秋 問4','APIキー短命化など一般的対策が攻撃の根本原因を遮断しない','攻撃の前提→成立条件→直接的対策→残るリスクの順に考える。盗用されたAPIキー対策と、ログイン後にAPIキーが発行される場合の対策は異なる。','脆弱性A → 権限取得 → 機能Bの不正利用','途中の弱い工程を連鎖させる','攻撃の成立に必要な条件を一つ直接壊す','「その対策をしても攻撃者はまだ成功するか？」と検証する'],
['api-key','WebAPI・APIキーと権限','Web・アプリ',3,'R6秋 問4','APIキーの失効と個人情報取得制限を混同','APIキーはAPI利用を認証・識別する秘密情報。盗まれた後の被害抑制には取得データの限定やアクセス元制限、失効と再発行が重要。','APIキー窃取 → WebAPIから大量のデータを取得','既存のキーを再利用してデータを取得する','最小権限・取得件数や情報項目の制限・監査・キー失効','アカウント乗っ取り防止とAPIキー悪用の対策を分離'],
['malware-log','マルウェア調査・各種ログ','調査・運用',3,'R6秋 問1','監視するログと異常事象を具体化できない','プロキシログは外部通信、認証ログはRDP等の認証、EDR/対策製品ログはプロセスや保護停止などを確認する。','不審通信や大量認証試行などが痕跡として残る','ログに残りにくい実行方法を探す','ログの種類ごとに検出したい事象を定義する','「どのログから」「何を検出するか」を答案に書く'],
['rdp','RDP・横展開・タスク永続化','攻撃と防御',3,'R6秋 問1','シンクライアントと仮想PCの通信制限を取り違えた','RDPは遠隔デスクトップ接続。侵害端末から他端末へ広げる横展開には認証ログ・接続元制限が有効。タスクスケジューラで再実行する永続化もある。','端末侵害 → RDPで別端末へ接続 → タスク登録','侵害端末を足場に内部を移動する','仮想PC間RDP制限・タスク調査・不審認証検知','接続元・接続先・対象ポートを具体化する'],
['scanners','ポートスキャン・脆弱性スキャン','調査・運用',3,'R7春 問4','台帳照合と現物スキャンの違いを混同','ポートスキャンは開いている通信ポートを調べる。脆弱性スキャンは稼働するサービス等の脆弱性を検査する。台帳は現物が登録済みかで信頼性が変わる。','未管理サーバの公開ポートや既知脆弱性を探す','見落とされた公開資産を探索する','公開資産の把握・必要範囲の検査・対策管理','「何が開いているか」と「脆弱か」は別の調査'],
['cvss-kev','CVSS・KEV・脆弱性管理','調査・運用',3,'R7春 問4 / R7春 問2','CVSSのバージョンとKEVの正式名称、評価と実悪用を混同','CVSSは脆弱性の深刻度等を評価する枠組み。KEVはKnown Exploited Vulnerabilitiesで実際の悪用が確認された脆弱性を掲載するカタログ。','既知の悪用済み脆弱性を優先して狙う','公開された脆弱性を攻撃に使う','資産と脆弱性を突合し、悪用状況・重要度に応じて対処する','CVSSが高いことと現実に悪用されていることを分ける'],

function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function topics(){let items=db.topics.filter(t=>(state.area==='すべて'||t.area===state.area)&&(state.priority==='すべて'||String(t.priority)===state.priority)&&((t.title+' '+t.symptom+' '+t.concept+' '+t.source).toLowerCase().includes(state.search.toLowerCase())));items.sort((a,b)=>b.priority-a.priority||a.mastery-b.mastery);return `${head('WEAKNESS LIBRARY','弱点ライブラリ','科目Bの過去問から見つかった弱点と、その技術的な仕組みを整理します。')}<div class="row wrap between" style="margin-bottom:16px"><span class="muted small">登録済み ${db.topics.length} 件 ／ 表示 ${items.length} 件</span><div class="row wrap"><button class="outline" data-modal="bulk">＋ まとめて追加</button><button class="primary" data-modal="topic">＋ 弱点を追加</button></div></div><div class="searchbar"><input type="text" id="topicSearch" class="search" placeholder="用語・症状・出題元を検索" value="${esc(state.search)}"><select id="areaFilter"><option>すべて</option>${AREAS.map(a=>`<option ${a===state.area?'selected':''}>${esc(a)}</option>`).join('')}</select><select id="priorityFilter"><option value="すべて">全優先度</option><option value="3" ${state.priority==='3'?'selected':''}>最優先</option><option value="2" ${state.priority==='2'?'selected':''}>重点</option><option value="1" ${state.priority==='1'?'selected':''}>通常</option></select></div><div class="cards">${items.map(t=>`<div class="topiccard" data-topic="${esc(t.id)}"><div class="row between"><span class="tag">${esc(t.area)}</span><span class="chip ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span></div><h3>${esc(t.title)}</h3><div class="description">${esc(t.symptom||'まだ詳しい内容は登録されていません。')}</div><div class="meter"><span style="width:${t.mastery||0}%"></span></div><div class="foot"><span>習熟度 ${t.mastery||0}% ｜ ${questionsOf(t.id).length} 問</span><span>${(t.due||today())<=today()?'復習対象':'次回 '+esc(t.due)}</span></div></div>`).join('')||'<div class="empty">一致する弱点はありません。</div>'}</div>`}
function topicDetail(){const t=topic(state.topicId);if(!t){state.topicId=null;return topics()}let qs=questionsOf(t.id);return `<div class="row between" style="margin-bottom:14px"><button class="ghost" data-action="back-topics">← 弱点一覧へ戻る</button><div class="row"><button class="outline" data-modal="topic" data-id="${esc(t.id)}">編集</button><button class="secondary" data-action="study-topic" data-id="${esc(t.id)}">この弱点を演習 →</button></div></div>${head('KNOWLEDGE NOTE',esc(t.title),`${esc(t.area)} ／ ${esc(t.source||'個人追加')}`)}<div class="topicdetail"><div class="stack"><section class="panel lesson"><div class="row between"><h2>1. 仕組みの理解</h2><span class="chip ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span></div><p>${fmt(t.concept||'仕組みのメモは未登録です。「編集」から追記できます。')}</p><h3>動作の流れ</h3><div class="lessonflow">${fmt(t.flow||'処理の流れを「A → B → C」のように記述すると、科目Bの答案に活かせます。')}</div><div class="lessonbox attacker"><strong>攻撃者の視点</strong><p>${fmt(t.attacker||'攻撃に必要な条件・利用する機能を整理しましょう。')}</p></div><div class="lessonbox defender"><strong>防御者の視点</strong><p>${fmt(t.defender||'どの条件を変えれば攻撃が成立しなくなるか考えましょう。')}</p></div><div class="lessonbox"><strong>答案のポイント</strong><p>${fmt(t.examTip||'対象・操作・効果を具体的に記述しましょう。')}</p></div></section><section class="panel"><div class="section-title"><h2>関連する演習問題</h2><button class="smallbtn" data-modal="question" data-id="${esc(t.id)}">＋ 問題を追加</button></div>${qs.length?qs.map((q,i)=>`<div class="taskrow"><div class="taskflag">${i+1}</div><div style="flex:1"><strong>${esc(q.prompt)}</strong><p>${q.type==='choice'?'4択・自動正誤判定':'記述・模範答案と自己評価'}</p></div><button class="smallbtn" data-action="study-question" data-id="${esc(q.id)}">解く</button></div>`).join(''):'<div class="hollow">問題未登録。新しい弱点でも「この弱点を演習」から説明トレーニングはできます。</div>'}</section></div><div class="stack"><section class="panel"><h2>習熟の記録</h2><div class="row between" style="margin:9px 0"><span class="muted small">現在の習熟度</span><strong style="font-size:28px">${t.mastery||0}%</strong></div><div class="meter" style="height:11px"><span style="width:${t.mastery||0}%"></span></div><div class="keyval"><span>復習回数</span><strong>${t.reviews||0}回</strong></div><div class="keyval"><span>連続で理解</span><strong>${t.streak||0}回</strong></div><div class="keyval"><span>次の復習日</span><strong>${esc(t.due||today())}</strong></div></section><section class="panel"><h2>つまずいた箇所</h2><p class="small">${fmt(t.symptom||'未入力')}</p><p class="eyelight">出題元：${esc(t.source||'未登録')}</p></section><section class="panel"><h2>この項目の学習メモ</h2><form id="topic-note-form"><input type="hidden" name="id" value="${esc(t.id)}"><textarea name="note" placeholder="例：権威DNSの設定を変えるのは管理者側…">${esc(t.note||'')}</textarea><button type="submit" class="outline" style="margin-top:10px">メモを保存</button></form></section></div></div>`}
function eligibleQuestions(){let q=[...db.questions];if(state.practiceArea!=='すべて')q=q.filter(x=>topic(x.topicId)?.area===state.practiceArea);return q}
function makeFallback(t){return{id:'reflect-'+t.id,topicId:t.id,type:'write',prompt:`「${t.title}」について、何が起こり、攻撃者がどう悪用し、何を設定・確認すれば防げるか説明せよ。`,scenario:'新規弱点の説明トレーニング',options:[],correct:null,keywords:[],model:t.concept||'模範答案は未登録。問題や学習ノートを編集して追加してください。',explanation:[t.flow,t.defender,t.examTip].filter(Boolean).join('\n'),fallback:true}}
function selectSession(custom){let picks;if(custom?.question)picks=[db.questions.find(q=>q.id===custom.question)].filter(Boolean);else if(custom?.topic){picks=questionsOf(custom.topic).slice();if(!picks.length&&topic(custom.topic))picks=[makeFallback(topic(custom.topic))]}else{let q=eligibleQuestions();let withRank=q.map(x=>{let t=topic(x.topicId)||{};let due=(t.due||today())<=today()?35:0;return{q:x,rank:due+(t.priority||1)*11+(100-(t.mastery||0))/5+(Math.random()*6)}});withRank.sort((a,b)=>b.rank-a.rank);let seen=new Set();picks=[];for(const item of withRank){if(!seen.has(item.q.topicId)){picks.push(item.q);seen.add(item.q.topicId)}if(picks.length>=state.practiceCount)break}for(const item of withRank){if(picks.length>=state.practiceCount)break;if(!picks.includes(item.q))picks.push(item.q)}if(!picks.length){const tt=db.topics.filter(t=>state.practiceArea==='すべて'||t.area===state.practiceArea).slice(0,state.practiceCount);picks=tt.map(makeFallback)}}if(!picks?.length){toast('演習対象がありません。弱点を追加してください');return}state.session={list:picks.map(q=>({...q})),index:0,answer:'',selected:null,revealed:false,correct:null,results:[],start:Date.now(),complete:false};state.page='study';render();window.scrollTo(0,0)}
function study(){if(!state.session)return studyStart();if(state.session.complete)return studyComplete();const s=state.session,q=s.list[s.index],t=topic(q.topicId);const percent=Math.round((s.index/s.list.length)*100);const choiceHTML=q.type==='choice'?`<div>${q.options.map((op,i)=>`<button class="choice ${s.selected===i?'picked':''} ${s.revealed&&q.correct===i?'correct':''} ${s.revealed&&s.selected===i&&s.correct===false?'incorrect':''}" data-action="choice" data-index="${i}" ${s.revealed?'disabled':''}><span class="letter">${'ABCD'[i]||i}</span><span class="answertext">${esc(op)}</span></button>`).join('')}</div>`:`<div class="formgroup"><label>記述答案（自由記述）</label><textarea id="freeAnswer" rows="5" placeholder="対象、条件、操作、目的を意識して書いてみよう" ${s.revealed?'readonly':''}>${esc(s.answer||'')}</textarea><p class="help">記述式は自動採点せず、模範答案と比較して自己評価します。</p></div>`;
const reviewHTML=s.revealed?`<div class="answerpanel ${s.correct===false?'bad':''}"><h3>${q.type==='choice'?(s.correct?'✓ 正解':'↻ もう一度確認'):'模範答案・採点ポイント'}</h3>${q.type==='choice'?`<p><b>正解：</b>${esc('ABCD'[q.correct])}：${esc(q.options[q.correct])}</p>`:`<p>${fmt(q.model||'模範答案未登録')}</p>${q.keywords?.length?`<div class="rubric">${q.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>`:''}`}<p class="small">${fmt(q.explanation||'')}</p>${q.type==='write'&&s.answer?`<div class="tip"><b>自分の答案：</b>${fmt(s.answer)}</div>`:''}<div class="eyelight" style="margin-top:13px">今回の理解度を選ぶと次回の復習日に反映されます</div><div class="ratings"><button data-action="rate" data-rate="again">↻ もう一度<small style="display:block;font-weight:400">今日中</small></button><button data-action="rate" data-rate="hard">△ あやふや<small style="display:block;font-weight:400">翌日</small></button><button data-action="rate" data-rate="good">✓ できた<small style="display:block;font-weight:400">数日後</small></button><button data-action="rate" data-rate="easy">★ 余裕<small style="display:block;font-weight:400">長めに復習</small></button></div></div>`:'';
return `${head('ACTIVE RECALL','シナリオ演習','知識を実際の攻撃と対策に結び付けて考えます。')}<div class="panel" style="max-width:820px;margin:auto"><div class="row between"><span class="eyelight">QUESTION ${s.index+1} / ${s.list.length}</span><span class="chip ${priorityClass(t?.priority||1)}">${esc(t?.area||'その他')}</span></div><div class="review-progress"><div style="width:${percent}%"></div></div><div class="review-head"><span class="small muted">関連する弱点：<button class="inline-edit" data-topic="${esc(q.topicId)}">${esc(t?.title||'')}</button></span><p class="focusmeter">目安：まず自分で考えてから解答を確認</p></div><div class="scenario">${fmt(q.scenario||'')}</div><div class="question">${esc(q.prompt)}</div>${choiceHTML}${!s.revealed?`<div class="row wrap" style="margin-top:18px"><button class="primary" data-action="reveal" ${q.type==='choice'&&s.selected==null?'disabled':''}>${q.type==='choice'?'回答して解説を見る':'模範答案を確認する'} →</button><button class="ghost" data-action="skip-question">後で復習する</button></div>`:''}${reviewHTML}</div>`}
function studyStart(){const count=state.practiceCount;return `${head('DAILY PRACTICE','演習モード','選択式は自動判定、記述式は模範答案と比較して自己評価。結果が復習間隔に反映されます。')}<div class="layout"><section class="panel"><div class="eyebrow">START A SESSION</div><h2 style="font-size:23px;margin:6px 0 8px">今日の弱点を5〜10問で強化</h2><p class="muted small">現在登録済みの問題 ${db.questions.length} 問。新しい問題も自分で追加できます。</p><div class="formgroup" style="margin-top:23px"><label>重点分野</label><select id="practiceArea"><option>すべて</option>${AREAS.map(a=>`<option ${state.practiceArea===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="formgroup"><label>出題数</label><div class="mode-tabs"><button data-count="5" class="${count===5?'active':''}">5問 / 15分</button><button data-count="10" class="${count===10?'active':''}">10問 / 30分</button><button data-count="3" class="${count===3?'active':''}">3問 / 10分</button></div></div><div class="helpbox">習熟度が低い項目と復習期日が来た項目を優先。既存問題が不足する場合は登録した範囲から出題します。</div><button class="primary" style="width:100%;margin-top:24px" data-action="start-study">この条件で演習を始める →</button></section><div class="stack"><section class="panel"><h2>今の復習状況</h2><div class="keyval"><span>復習対象</span><strong>${dueCount()} 件</strong></div><div class="keyval"><span>記述と選択の問題</span><strong>${db.questions.filter(q=>q.type==='write').length} / ${db.questions.filter(q=>q.type==='choice').length}</strong></div><div class="keyval"><span>積み重ねた復習</span><strong>${db.reviews.length} 回</strong></div></section><section class="panel"><h2>新しい問題も追加できる</h2><p class="small muted">採点後に見つかった弱点の記述問題・4択問題を自分で登録。既存の弱点にも紐付けられる。</p><button data-modal="question" class="outline">＋ 演習問題を追加</button></section></div></div>`}
function studyComplete(){let s=state.session,n=s.results.length,correct=s.results.filter(x=>x.correct).length;return `${head('SESSION COMPLETE','本日の演習、お疲れさま。','正解した問題も、説明できなかった部分があれば弱点リストに残そう。')}<div class="panel finish"><div class="fin-icon">✳</div><h2>${n}問の復習を記録</h2><p class="muted">選択式の正答数は自動集計。記述式は自己評価を記録しています。</p><div class="stats" style="grid-template-columns:repeat(3,1fr);margin:20px 0"><div class="stat"><div class="label">復習数</div><div class="num">${n}</div></div><div class="stat"><div class="label">選択正解</div><div class="num">${correct}</div></div><div class="stat"><div class="label">復習対象</div><div class="num">${dueCount()}</div></div></div><div class="stack">${s.results.map((r,i)=>`<div class="topic-mini" style="text-align:left"><div class="row between"><strong>${i+1}. ${esc(topic(r.topicId)?.title||'')}</strong><span class="chip ${r.rating==='again'?'due':r.rating==='hard'?'mid':'good'}">${esc(({again:'もう一度',hard:'あやふや',good:'できた',easy:'余裕'})[r.rating]||r.rating)}</span></div><div class="info-sub">次回 ${esc(topic(r.topicId)?.due||today())}</div></div>`).join('')}</div><div class="row wrap" style="justify-content:center;margin-top:20px"><button class="primary" data-action="start-study">次の5問を解く</button><button class="outline" data-action="end-study">ホームへ戻る</button></div></div>`}

function mergeData(raw,replace=false){if(!raw||typeof raw!=='object')throw Error('JSON形式が不正です');if(replace){validateDB(raw);db=raw;v3Migrate();return`バックアップを復元しました：${db.topics.length}件`}let itemCount=0;if(Array.isArray(raw.topics)){for(const rt of raw.topics){if(!rt||typeof rt!=='object'||!rt.title)continue;let t={id:String(rt.id||nextId('topic')),title:String(rt.title).slice(0,140),area:AREAS.includes(rt.area)?rt.area:'その他',priority:[1,2,3].includes(Number(rt.priority))?Number(rt.priority):3,source:String(rt.source||'外部取り込み'),symptom:String(rt.symptom||''),concept:String(rt.concept||''),flow:String(rt.flow||''),attacker:String(rt.attacker||''),defender:String(rt.defender||''),examTip:String(rt.examTip||''),mastery:Math.max(0,Math.min(100,Number(rt.mastery)||10)),due:rt.due&&/^\d{4}-\d{2}-\d{2}$/.test(rt.due)?rt.due:today(),last:rt.last||'',streak:Number(rt.streak)||0,reviews:Number(rt.reviews)||0,note:String(rt.note||''),custom:true};let idx=db.topics.findIndex(x=>x.id===t.id);if(idx<0)idx=db.topics.findIndex(x=>x.title===t.title);if(idx>=0){const old=db.topics[idx];db.topics[idx]={...old,...t,id:old.id}}else db.topics.push(t);itemCount++}}if(Array.isArray(raw.questions)){for(const rq of raw.questions){if(!rq||typeof rq!=='object'||!rq.prompt||!rq.topicId)continue;const q={id:String(rq.id||nextId('q')),topicId:String(rq.topicId),type:rq.type==='choice'?'choice':'write',scenario:String(rq.scenario||''),prompt:String(rq.prompt),options:Array.isArray(rq.options)?rq.options.map(String).slice(0,4):[],correct:Number.isInteger(rq.correct)?rq.correct:null,model:String(rq.model||''),keywords:Array.isArray(rq.keywords)?rq.keywords.map(String):[],explanation:String(rq.explanation||''),custom:true};if(!db.topics.some(t=>t.id===q.topicId))continue;if(q.type==='choice'&&(q.options.length!==4||q.correct===null||q.correct<0||q.correct>3))continue;const ix=db.questions.findIndex(x=>x.id===q.id);if(ix>=0)db.questions[ix]=q;else db.questions.push(q);itemCount++}}if(Array.isArray(raw.attempts)){for(const a of raw.attempts){if(!a||!a.year||!a.q)continue;const x={id:String(a.id||nextId('exam')),year:String(a.year),season:String(a.season||'春'),q:String(a.q),score:a.score===null?null:Number(a.score),before:String(a.before||''),after:String(a.after||''),minutes:a.minutes==null?null:Number(a.minutes),note:String(a.note||''),invalid:Boolean(a.invalid),date:a.date||today()};const ix=db.attempts.findIndex(z=>z.id===x.id);if(ix>=0)db.attempts[ix]=x;else db.attempts.push(x);itemCount++}}for(const [key,aliases] of [['extraSystems',['extraSystems','systems']],['extraSteps',['extraSteps','steps']],['extraAttacks',['extraAttacks','attacks']],['extraTerms',['extraTerms','terms']]]){const input=aliases.map(a=>raw[a]).find(Array.isArray);if(!input)continue;for(const x of input){if(!x||typeof x!=='object')continue;const k=key==='extraTerms'?'abbr':'id';if(typeof x[k]!=='string'||!x[k].trim())continue;if(key==='extraTerms'&&allTerms().some(t=>t.abbr.toLowerCase()===x.abbr.toLowerCase()&&!db.extraTerms.some(e=>e.abbr===x.abbr)))continue;let index=db[key].findIndex(y=>y[k]===x[k]);if(index>=0)db[key][index]=x;else db[key].push(x);itemCount++;}}if(raw.lessonProgress&&typeof raw.lessonProgress==='object')Object.assign(db.lessonProgress,raw.lessonProgress);if(raw.termKnown&&typeof raw.termKnown==='object')Object.assign(db.termKnown,raw.termKnown);if(raw.stepWeaknessLinks&&typeof raw.stepWeaknessLinks==='object')Object.assign(db.stepWeaknessLinks,raw.stepWeaknessLinks);return`${itemCount}件を取り込みました`}

function makePrompt(){return `あなたは情報処理安全確保支援士・科目Bの学習コーチです。次の採点結果から、新しい弱点だけを抽出し、このオフライン学習アプリに取り込めるJSONを出力してください。コードフェンス以外の説明は別にしてください。形式：{ "topics": [{ "id":"topic-一意の識別子", "title":"用語や技術名", "area":"通信・ネットワーク | Web・アプリ | 攻撃と防御 | 調査・運用 | 認証・暗号 | 記述技術 | その他のいずれか", "priority":3, "source":"問題名", "symptom":"答案上の具体的な弱点", "concept":"技術を実務未経験者に説明", "flow":"処理・攻撃の流れ", "attacker":"攻撃者の視点", "defender":"防御者の視点", "examTip":"記述答案のポイント" }] }。誤情報を入れず、公式解答と答案のズレに基づき作成してください。存在しない情報は推測しないでください。既存の弱点名：${db.topics.map(t=>t.title).join('、')}。関連するシステム工程が既にある場合は、ユーザーにどの工程に紐付くかも説明してください。新しい略語がある場合は別途 {"terms":[{"abbr":"略語","full":"正式英語名","jp":"日本語名","meaning":"使う場面","system":"web | auth | mail | office | manage"}]} を出力できます。過去問採点結果：ここに貼り付けてください。`}

function recordRating(rating){const s=state.session;if(!s||!s.revealed)return;const q=s.list[s.index],t=topic(q.topicId);if(!t)return;const delta={again:-14,hard:2,good:12,easy:22}[rating]||0;t.mastery=Math.max(0,Math.min(100,(t.mastery||0)+delta));if(['good','easy'].includes(rating))t.streak=(t.streak||0)+1;else t.streak=0;t.reviews=(t.reviews||0)+1;t.last=today();const days=rating==='again'?0:rating==='hard'?1:rating==='good'?Math.min(30,[2,4,7,14,25,30][Math.min(t.streak-1,5)]):Math.min(60,[4,7,14,30,45,60][Math.min(t.streak-1,5)]);t.due=plusDays(days);const row={id:nextId('review'),date:new Date().toISOString(),topicId:q.topicId,questionId:q.id,correct:q.type==='choice'?s.correct:null,rating,answer:q.type==='choice'?q.options[s.selected]:s.answer,elapsed:Math.round((Date.now()-s.start)/1000)};db.reviews.push(row);s.results.push(row);s.index++;s.answer='';s.selected=null;s.revealed=false;s.correct=null;if(s.index>=s.list.length)s.complete=true;save();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;state.topicId=null;state.session=null;render();window.scrollTo(0,0);return}const topicBtn=e.target.closest('[data-topic]');if(topicBtn){state.topicId=topicBtn.dataset.topic;state.page='topics';state.session=null;render();window.scrollTo(0,0);return}const count=e.target.closest('[data-count]');if(count){state.practiceCount=Number(count.dataset.count);render();return}const btn=e.target.closest('[data-modal]');if(btn){showModal(btn.dataset.modal,btn.dataset.id);return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;if(a==='close-modal'){closeModal();return}if(a==='start-study'){selectSession();return}if(a==='end-study'){state.session=null;state.page='systems';render();return}if(a==='back-topics'){state.topicId=null;render();return}if(a==='study-topic'){selectSession({topic:action.dataset.id});return}if(a==='study-question'){selectSession({question:action.dataset.id});return}if(a==='choice'){if(!state.session?.revealed){state.session.selected=Number(action.dataset.index);render()}return}if(a==='reveal'){const s=state.session,q=s.list[s.index];if(q.type==='write')s.answer=$('freeAnswer')?.value||'';s.correct=q.type==='choice'?s.selected===q.correct:null;s.revealed=true;render();return}if(a==='skip-question'){const s=state.session,q=s.list[s.index];const t=topic(q.topicId);if(t){t.due=today();save()}s.results.push({topicId:q.topicId,questionId:q.id,correct:null,rating:'again'});s.index++;s.selected=null;s.answer='';s.revealed=false;if(s.index>=s.list.length)s.complete=true;render();window.scrollTo(0,0);return}if(a==='rate'){recordRating(action.dataset.rate);return}if(a==='export'){download('SC_Field_Lab_backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('バックアップを書き出しました');return}if(a==='import-file'){$('importFile')?.click();return}if(a==='restore-file'){$('restoreFile')?.click();return}if(a==='copy-prompt'){copyText(makePrompt());return}if(a==='reset-data'){if(confirm('これまでの学習記録・追加した弱点・問題をすべて初期状態に戻します。よろしいですか？')){if(confirm('本当に初期化しますか？取り消せません。')){db=fresh();v3Migrate();save();closeModalIfOpen();state={...state,page:'systems',topicId:null,session:null};render();toast('初期化しました')}}return}});
document.addEventListener('change',e=>{if(e.target.id==='areaFilter'){state.area=e.target.value;render()}if(e.target.id==='priorityFilter'){state.priority=e.target.value;render()}if(e.target.id==='practiceArea'){state.practiceArea=e.target.value;render()}if(e.target.id==='questionType'){const choice=e.target.value==='choice';$('choiceFields').style.display=choice?'':'none';$('writeFields').style.display=choice?'none':''}if(e.target.id==='importFile')readImport(e.target.files?.[0],false);if(e.target.id==='restoreFile')readImport(e.target.files?.[0],true)});
document.addEventListener('input',e=>{if(e.target.id==='topicSearch'){const a=e.target.selectionStart;state.search=e.target.value;const old=document.activeElement;const container=$('root');let items=db.topics.filter(t=>(state.area==='すべて'||t.area===state.area)&&(state.priority==='すべて'||String(t.priority)===state.priority)&&((t.title+' '+t.symptom+' '+t.concept+' '+t.source).toLowerCase().includes(state.search.toLowerCase())));items.sort((a,b)=>b.priority-a.priority||a.mastery-b.mastery);const cards=container.querySelector('.cards');if(cards)cards.innerHTML=items.map(t=>`<div class="topiccard" data-topic="${esc(t.id)}"><div class="row between"><span class="tag">${esc(t.area)}</span><span class="chip ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span></div><h3>${esc(t.title)}</h3><div class="description">${esc(t.symptom||'')}</div><div class="meter"><span style="width:${t.mastery||0}%"></span></div><div class="foot"><span>習熟度 ${t.mastery||0}% ｜ ${questionsOf(t.id).length} 問</span><span>${(t.due||today())<=today()?'復習対象':'次回 '+esc(t.due)}</span></div></div>`).join('')||'<div class="empty">一致する弱点はありません。</div>';const counter=container.querySelector('.row.wrap.between .muted.small');if(counter)counter.textContent=`登録済み ${db.topics.length} 件 ／ 表示 ${items.length} 件`}});
document.addEventListener('submit',e=>{const form=e.target;const formId=form.getAttribute('id');if(!['topic-form','question-form','bulk-form','exam-form','topic-note-form','exam-date-form','json-form'].includes(formId))return;e.preventDefault();const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();try{if(formId==='topic-form'){const id=v('id'),t=id?topic(id):null;if(!v('title'))throw Error('弱点名を入力してください');if(t){Object.assign(t,{title:v('title'),area:v('area'),priority:Number(v('priority')),source:v('source'),symptom:v('symptom'),concept:v('concept'),flow:v('flow'),attacker:v('attacker'),defender:v('defender'),examTip:v('examTip')})}else{db.topics.push({id:nextId('topic'),title:v('title'),area:v('area'),priority:Number(v('priority')),source:v('source'),symptom:v('symptom'),concept:v('concept'),flow:v('flow'),attacker:v('attacker'),defender:v('defender'),examTip:v('examTip'),mastery:10,streak:0,reviews:0,due:today(),last:'',custom:true})}toast(t?'弱点を更新しました':'新しい弱点を登録しました')}

else if(formId==='bulk-form'){const lines=v('list').split(/\r?\n/).filter(Boolean);let add=0;for(const line of lines){let parts=line.split(/[|｜\t]/).map(x=>x.trim());if(!parts[0])continue;let [title,area,symptom]=parts;if(db.topics.some(t=>t.title===title))continue;db.topics.push({id:nextId('topic'),title,area:AREAS.includes(area)?area:'その他',priority:3,source:'演習メモ',symptom:symptom||(AREAS.includes(area)?'':' '+(area||'')),concept:'',flow:'',attacker:'',defender:'',examTip:'',mastery:10,streak:0,reviews:0,due:today(),custom:true});add++}toast(`${add}件の弱点を追加しました`)}
else if(formId==='exam-form'){const id=v('id'),a=id?db.attempts.find(x=>x.id===id):null;const item={id:a?.id||nextId('exam'),year:v('year'),season:v('season'),q:v('q'),score:v('score')===''?null:Number(v('score')),before:v('before'),after:v('after'),minutes:v('minutes')===''?null:Number(v('minutes')),note:v('note'),invalid:!!fd.get('invalid'),date:today()};if(a)Object.assign(a,item);else db.attempts.push(item);const lines=v('weaknesses').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const title of lines){if(!db.topics.some(t=>t.title===title))db.topics.push({id:nextId('topic'),title,area:'その他',priority:3,source:`${item.year}${item.season} 問${item.q}`,symptom:'演習で理解不足を確認',concept:'',flow:'',attacker:'',defender:'',examTip:'',mastery:10,streak:0,reviews:0,due:today(),custom:true})}toast('過去問の結果を保存しました')}
else if(formId==='topic-note-form'){let t=topic(v('id'));if(t)t.note=v('note');toast('メモを保存しました')}
else if(formId==='exam-date-form'){db.examDate=v('examDate');toast('試験日を変更しました')}
else if(formId==='json-form'){const x=JSON.parse(v('json'));toast(mergeData(x,false))}

else if(type==='add-term')h=`<div class="modal-head"><h2>略語・用語を追加</h2>${close}</div><form id="v3TermForm"><div class="formgroup"><label>略語または用語 *</label><input name="abbr" maxlength="25" required placeholder="例：SASE"></div><div class="formgroup"><label>正式な英語名称 *</label><input name="full" maxlength="170" required placeholder="何の頭文字か。略語でなければその旨を記載"></div><div class="formgroup"><label>日本語名 *</label><input name="jp" required></div><div class="formgroup"><label>システム内の役割</label><textarea name="meaning"></textarea></div><div class="formgroup"><label>関連システム</label><select name="system">${sopts}</select></div><div class="modal-foot"><button class="primary">辞典に追加</button></div></form>`;
else if(type==='link-weakness'){const st=stepById(id),old=db.stepWeaknessLinks[id]||[];h=`<div class="modal-head"><h2>工程に弱点を紐付け</h2>${close}</div><p class="muted">${esc(st?.name||'')} に対応する過去問の弱点を選択。</p><form id="v3LinkForm"><input type="hidden" name="step" value="${esc(id)}"><div class="formgroup"><label>登録済みの弱点</label><select name="topic"><option value="">選択してください</option>${db.topics.map(t=>`<option value="${esc(t.id)}" ${old.includes(t.id)?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><p class="small muted">新しい弱点がまだなければ、閉じて「弱点リスト」の追加フォームで登録してから紐付けてください。</p><div class="modal-foot"><button class="primary">紐付ける</button></div></form>`;}
box.innerHTML=h;state.modal={type,id};if(!$('modal').open)$('modal').showModal();}
function v3lines(x){return String(x||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,20)}
function v3InputEvents(){document.addEventListener('click',e=>{const el=e.target.closest('[data-v3]');if(!el)return;const cmd=el.dataset.v3,id=el.dataset.id; if(cmd==='select-system'){state.mapSystem=id;state.mapStep=sysSteps(id)[0]?.id||'';state.mapOpenCheck=false;state.page='systems';render();return}
 if(cmd==='select-step'){state.mapStep=id;state.mapOpenCheck=false;render();return}
 if(cmd==='go-step'){let s=sysForStep(id);if(s){state.mapSystem=s.id;state.mapStep=id;state.mapOpenCheck=false;state.page='systems';render();window.scrollTo(0,0)}return}
 if(cmd==='go-attack'||cmd==='select-attack'){state.selectedAttack=id;state.page='attacks';render();if(cmd==='go-attack')window.scrollTo(0,0);return}
 if(cmd==='go-term'){state.page='glossary';state.termQuery=id||'';state.termSys='すべて';state.hideExpansions=false;render();window.scrollTo(0,0);return}
 if(cmd==='reveal-check'){state.mapOpenCheck=!state.mapOpenCheck;render();return}
 if(cmd==='grade-step'){db.lessonProgress[state.mapStep]=el.dataset.rating;save();render();toast(el.dataset.rating==='done'?'理解済みに記録しました':'復習対象に記録しました');return}
 if(cmd==='reveal-term'){state.revealedTerms[id]=!state.revealedTerms[id];const target=el.closest('.term-entry');if(target)target.outerHTML=v3TermRow(termByAbbr(id));return}
 if(cmd==='mark-term'){db.termKnown[id]=!db.termKnown[id];save();const target=el.closest('.term-entry');if(target)target.outerHTML=v3TermRow(termByAbbr(id));return}
 if(cmd==='toggle-term-quiz'){state.hideExpansions=!state.hideExpansions;state.termReverse=false;state.revealedTerms={};render();return}if(cmd==='toggle-term-reverse'){state.termReverse=!state.termReverse;state.hideExpansions=false;state.revealedTerms={};render();return}
 if(cmd==='close-modal'){closeModal();return}
 if(['add-system','add-step','add-attack','add-term','link-weakness'].includes(cmd)){v3Modal(cmd,id||state.mapSystem);return}
 });
 document.addEventListener('input',e=>{if(e.target.id==='termSearch'){state.termQuery=e.target.value;$('termList').innerHTML=v3TermItems();}if(e.target.id==='attackSearch'){state.attackQuery=e.target.value;$('attackList').innerHTML=v3AttackItems();}});
 document.addEventListener('change',e=>{if(e.target.id==='termSystem'){state.termSys=e.target.value;$('termList').innerHTML=v3TermItems();}if(e.target.id==='attackSystem'){state.attackSys=e.target.value;$('attackList').innerHTML=v3AttackItems();}if(e.target.id==='v3AttackSys'){const steps=sysSteps(e.target.value),el=$('v3AttackStep');el.innerHTML=steps.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')||'<option value="">工程未登録</option>';}});
 document.addEventListener('submit',e=>{const f=e.target,id=f.id;if(!['v3SystemForm','v3StepForm','v3AttackForm','v3TermForm','v3LinkForm'].includes(id))return;e.preventDefault();const values=new FormData(f),v=k=>String(values.get(k)||'').trim();try{if(id==='v3SystemForm'){if(!v('title'))throw Error('名前を入力してください');const sys={id:nextId('sys'),title:v('title'),short:v('title'),summary:v('summary'),story:v('story'),context:v('context'),steps:[]};db.extraSystems.push(sys);state.mapSystem=sys.id;state.mapStep='';state.page='systems';toast('システムを追加。次は工程を登録してください。');}
 else if(id==='v3StepForm'){if(!v('name')||!v('role')||!sysById(v('system')))throw Error('工程名・役割・システムが必要');const st={id:nextId('step'),system:v('system'),name:v('name'),brief:v('brief'),role:v('role'),mechanism:v('mechanism'),example:v('example'),defenses:v3lines(v('defenses')),terms:v('terms').split(/[,、]/).map(x=>x.trim()).filter(Boolean),check:v('check'),topics:[],attacks:[]};db.extraSteps.push(st);state.mapSystem=st.system;state.mapStep=st.id;state.page='systems';toast('工程を追加しました');}
 else if(id==='v3AttackForm'){if(!v('name')||!v('needed')||!v('process')||!sysById(v('system')))throw Error('攻撃名・成立条件・流れ・システムが必要');const a={id:nextId('attack'),name:v('name'),english:v('english'),system:v('system'),step:v('step'),needed:v('needed'),process:v3lines(v('process')),impact:v('impact'),prevent:v3lines(v('prevent')),detect:v3lines(v('detect'))};db.extraAttacks.push(a);state.selectedAttack=a.id;state.page='attacks';toast('攻撃を登録しました');}
 else if(id==='v3TermForm'){if(!v('abbr')||!v('full')||!v('jp'))throw Error('略語・正式名称・日本語訳を入力してください');if(allTerms().some(t=>t.abbr.toLowerCase()===v('abbr').toLowerCase()))throw Error('この用語は登録済みです');db.extraTerms.push({abbr:v('abbr'),full:v('full'),jp:v('jp'),meaning:v('meaning'),system:v('system')});state.termQuery=v('abbr');state.termSys='すべて';state.page='glossary';toast('用語を登録しました');}
 else if(id==='v3LinkForm'){if(!topic(v('topic')))throw Error('弱点を選択してください');const a=db.stepWeaknessLinks[v('step')]||[];if(!a.includes(v('topic')))a.push(v('topic'));db.stepWeaknessLinks[v('step')]=a;state.mapSystem=sysForStep(v('step'))?.id||state.mapSystem;state.mapStep=v('step');state.page='systems';toast('弱点を紐付けました');}
 save();closeModalIfOpen();render();}catch(err){alert(err.message)}});
}
v3InputEvents();

render();
</script>
</body></html>
