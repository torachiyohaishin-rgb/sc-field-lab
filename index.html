const seedTopics=[
['http-methods','HTTPのGET・POST・PUT','通信・ネットワーク',3,'R6秋 問3','HTTPメソッドとステータスを攻撃の流れに結び付けられない','GETは取得、POSTは処理依頼、PUTは指定資源の作成・置換。機密値をURLに含めるとログにも残り得る。','PUTで公開JSが置換 → ブラウザが悪意あるJSを実行 → GETのURLで情報が流出','更新可能な公開領域を狙い、不正スクリプトを配置する','不要なHTTPメソッドを禁止し、重要ファイルの改ざんを監視する','HTTPメソッド、対象パス、レスポンスコード、ログの記録項目を対応付ける'],
['session','Cookieとセッション固定攻撃','Web・アプリ',3,'R6秋 問4','セッションIDを隠すだけの対策を書いた','Cookieはブラウザが保持して送信するデータ。セッションIDはサーバ上のログイン状態と利用者を結び付ける識別子。ログイン成功時にIDを再発行する。','攻撃者が既知のセッションIDを被害者に使わせる → 被害者がログイン → 同じIDを悪用','既知のセッションIDを利用者に固定する','ログイン時にセッションIDを再生成し、旧IDを無効化する','攻撃者が既にIDを知っている場合は「隠す」だけでは防げない'],
['dns-record','権威DNS・CNAME・旧ドメイン','通信・ネットワーク',3,'R7春 問4','公開Webサーバと権威DNSの役割を混同','権威DNSはドメインの正式なレコードを管理する。CNAMEは別名の参照先を指定する。利用終了サービスを指すCNAMEは放置すると乗っ取られる場合がある。','サービスの契約終了 → CNAMEが残存 → 攻撃者が参照先を取得','利用されていない外部サービスの名前を再取得する','不要なCNAMEを権威DNSから削除し、資産棚卸しを行う','「どの装置」の「どのレコード」を変更するかを答案に書く'],

function studyStart(){const count=state.practiceCount;return `${head('DAILY PRACTICE','演習モード','選択式は自動判定、記述式は模範答案と比較して自己評価。結果が復習間隔に反映されます。')}<div class="layout"><section class="panel"><div class="eyebrow">START A SESSION</div><h2 style="font-size:23px;margin:6px 0 8px">今日の弱点を5〜10問で強化</h2><p class="muted small">現在登録済みの問題 ${db.questions.length} 問。新しい問題も自分で追加できます。</p><div class="formgroup" style="margin-top:23px"><label>重点分野</label><select id="practiceArea"><option>すべて</option>${AREAS.map(a=>`<option ${state.practiceArea===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="formgroup"><label>出題数</label><div class="mode-tabs"><button data-count="5" class="${count===5?'active':''}">5問 / 15分</button><button data-count="10" class="${count===10?'active':''}">10問 / 30分</button><button data-count="3" class="${count===3?'active':''}">3問 / 10分</button></div></div><div class="helpbox">習熟度が低い項目と復習期日が来た項目を優先。既存問題が不足する場合は登録した範囲から出題します。</div><button class="primary" style="width:100%;margin-top:24px" data-action="start-study">この条件で演習を始める →</button></section><div class="stack"><section class="panel"><h2>今の復習状況</h2><div class="keyval"><span>復習対象</span><strong>${dueCount()} 件</strong></div><div class="keyval"><span>記述と選択の問題</span><strong>${db.questions.filter(q=>q.type==='write').length} / ${db.questions.filter(q=>q.type==='choice').length}</strong></div><div class="keyval"><span>積み重ねた復習</span><strong>${db.reviews.length} 回</strong></div></section><section class="panel"><h2>新しい問題も追加できる</h2><p class="small muted">採点後に見つかった弱点の記述問題・4択問題を自分で登録。既存の弱点にも紐付けられる。</p><button data-modal="question" class="outline">＋ 演習問題を追加</button></section></div></div>`}
function studyComplete(){let s=state.session,n=s.results.length,correct=s.results.filter(x=>x.correct).length;return `${head('SESSION COMPLETE','本日の演習、お疲れさま。','正解した問題も、説明できなかった部分があれば弱点リストに残そう。')}<div class="panel finish"><div class="fin-icon">✳</div><h2>${n}問の復習を記録</h2><p class="muted">選択式の正答数は自動集計。記述式は自己評価を記録しています。</p><div class="stats" style="grid-template-columns:repeat(3,1fr);margin:20px 0"><div class="stat"><div class="label">復習数</div><div class="num">${n}</div></div><div class="stat"><div class="label">選択正解</div><div class="num">${correct}</div></div><div class="stat"><div class="label">復習対象</div><div class="num">${dueCount()}</div></div></div><div class="stack">${s.results.map((r,i)=>`<div class="topic-mini" style="text-align:left"><div class="row between"><strong>${i+1}. ${esc(topic(r.topicId)?.title||'')}</strong><span class="chip ${r.rating==='again'?'due':r.rating==='hard'?'mid':'good'}">${esc(({again:'もう一度',hard:'あやふや',good:'できた',easy:'余裕'})[r.rating]||r.rating)}</span></div><div class="info-sub">次回 ${esc(topic(r.topicId)?.due||today())}</div></div>`).join('')}</div><div class="row wrap" style="justify-content:center;margin-top:20px"><button class="primary" data-action="start-study">次の5問を解く</button><button class="outline" data-action="end-study">ホームへ戻る</button></div></div>`}
function exams(){const sorted=[...db.attempts].sort((a,b)=>b.year.localeCompare(a.year)||(a.season==='秋'?-1:1)-(b.season==='秋'?-1:1)||Number(a.q)-Number(b.q));const valid=db.attempts.filter(a=>!a.invalid&&Number.isFinite(Number(a.score)));const avg=valid.length?(valid.reduce((s,a)=>s+Number(a.score),0)/valid.length).toFixed(1):'–';return `${head('EXAM LOGBOOK','過去問の演習記録','初期12問の独自推定得点を登録済み。新しい問題や発見した弱点も追記できます。')}<div class="stats"><div class="panel stat"><div class="label">大問演習</div><div class="num">${db.attempts.length}</div></div><div class="panel stat"><div class="label">予想平均（参考）</div><div class="num">${avg}</div><div class="note">50点満点・無効値を除外</div></div><div class="panel stat"><div class="label">最高予想点</div><div class="num">${valid.length?Math.max(...valid.map(a=>Number(a.score))):'–'}</div></div><div class="panel stat"><div class="label">当初の目標</div><div class="num">30<span style="font-size:14px">＋</span></div><div class="note">1問につき</div></div></div><div class="layout"><section class="panel"><div class="section-title"><h2>演習履歴</h2><button class="primary" data-modal="exam">＋ 結果を追加</button></div><div style="overflow-x:auto"><table class="row-table"><thead><tr><th>回</th><th>予想点</th><th class="hide-mobile">事前→事後</th><th class="hide-mobile">所要</th><th>記録</th></tr></thead><tbody>${sorted.map(a=>`<tr><td><strong>R${Number(a.year)-2018}${esc(a.season)} 問${esc(a.q)}</strong>${a.invalid?' <span class="chip due">比較除外</span>':''}</td><td>${a.score==null?'–':esc(a.score)}/50</td><td class="hide-mobile">${esc(a.before||'–')} → ${esc(a.after||'–')}</td><td class="hide-mobile">${a.minutes||'–'}分</td><td><button class="smallbtn" data-modal="exam" data-id="${esc(a.id)}">編集</button></td></tr>`).join('')}</tbody></table></div></section><div class="stack"><section class="panel"><h2>得点の推移（参考）</h2><p class="muted tiny">既知の12問。無効フォームの問題は棒を薄く表示。</p><div class="exam-timeline">${db.attempts.slice(-20).map(a=>`<div class="exam-col" title="${esc(a.year)}${esc(a.season)}問${esc(a.q)}: ${a.score}点"><div class="exam-bar" style="height:${Math.max(4,Math.min(100,(Number(a.score)||0)/50*100))}%;opacity:${a.invalid?.26:1}"></div><div class="exam-label">${esc(a.q)}</div></div>`).join('')}</div><p class="help">各棒は各回の問題。年度・期と得点は左の表を確認してください。</p></section><section class="panel"><h2>振り返りを登録するとき</h2><div class="taskrow"><div class="taskflag">1</div><div><strong>得点・選択判断を記録</strong><p>解答時間と、予想のズレも残す</p></div></div><div class="taskrow"><div class="taskflag">2</div><div><strong>発覚した弱点を書き出す</strong><p>1行1項目で自動追加できる</p></div></div><div class="taskrow"><div class="taskflag">3</div><div><strong>短い応用問題を作る</strong><p>出題者の意図に近い練習を追加</p></div></div></section></div></div>`}
function settings(){return `${head('DATA & SETTINGS','設定・バックアップ','学習データの持ち運びや、次回の演習で見つかった弱点の一括取り込みができます。')}<div class="layout"><div class="stack"><section class="panel"><h2>試験日と学習期限</h2><p class="small muted">カウントダウンは目標日の設定に合わせて更新。</p><form id="exam-date-form" class="row wrap" style="margin-top:15px"><input style="flex:1" type="date" name="examDate" value="${esc(db.examDate)}" required><button class="primary">日付を保存</button></form></section><section class="panel"><div class="section-title"><h2>学習データのバックアップ</h2><span class="chip good">JSON対応</span></div><p class="small muted">弱点の学習ノート・復習間隔・記述問題・過去問ログをまとめて保存します。端末変更やブラウザのデータ消去に備えて定期的に保存してください。</p><div class="row wrap"><button class="primary" data-action="export">↓ JSONをダウンロード</button><button class="outline" data-action="import-file">↑ JSONを読み込む</button></div><input type="file" id="importFile" accept=".json,application/json" style="display:none"><p class="help">「読み込む」は既存データとの統合を試み、同じIDの項目は更新します。全件を戻す場合は「バックアップの復元」を使用。</p><button class="smallbtn" style="margin-top:12px" data-modal="restore">バックアップの復元・初期化</button></section><section class="panel"><h2>新しい弱点を一括で追加</h2><p class="small muted">形式：1行につき「用語｜分野｜つまずいた内容」。分野を省略しても登録できます。追加された弱点は次の復習に反映。</p><button class="outline" data-modal="bulk">＋ 一括登録する</button></section></div><div class="stack"><section class="panel"><h2>ChatGPTの採点結果を取り込む</h2><p class="small muted">採点後に新しい弱点を抽出して、アプリへ反映するための専用プロンプトをコピーできます。</p><button class="secondary" style="width:100%" data-action="copy-prompt">採点結果の整理用プロンプトをコピー</button><p class="help">ChatGPTと自動連携する機能ではありません。出力されたJSONをこのアプリへ貼り付けて取り込みます。</p><button class="outline" data-modal="json-merge" style="width:100%;margin-top:11px">JSONテキストを取り込む</button></section><section class="panel"><h2>このアプリについて</h2><div class="keyval"><span>データ形式</span><strong>SC Field Lab v2</strong></div><div class="keyval"><span>登録問題</span><strong>${db.questions.length}問</strong></div><div class="keyval"><span>登録弱点</span><strong>${db.topics.length}件</strong></div><div class="keyval"><span>復習履歴</span><strong>${db.reviews.length}件</strong></div><div class="warn" style="margin-top:13px">このファイルは通信なしで動きます。入力内容はブラウザの保存領域に保持され、別の端末に自動同期されません。端末やブラウザによってファイルとして開いた場合の保存が不安定なことがあるため、JSONバックアップを推奨します。</div></section></div></div>`}
function showModal(type,id){const body=$('modalBody');const close=`<button class="roundx" type="button" data-action="close-modal" aria-label="閉じる">×</button>`;const opts=AREAS.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');let html='';state.modal={type,id};if(type==='topic'){const t=id?topic(id):null;html=`<div class="modal-head"><h2>${t?'弱点を編集':'新しい弱点を追加'}</h2>${close}</div><form id="topic-form"><input type="hidden" name="id" value="${esc(t?.id||'')}"><div class="formgroup"><label>弱点名 *</label><input type="text" name="title" maxlength="100" required placeholder="例：DNSキャッシュと権威DNSの違い" value="${esc(t?.title||'')}"></div><div class="gridtwo"><div class="formgroup"><label>分野</label><select name="area">${AREAS.map(a=>`<option ${a===t?.area?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="formgroup"><label>優先度</label><select name="priority"><option value="3" ${!t||t.priority===3?'selected':''}>最優先</option><option value="2" ${t?.priority===2?'selected':''}>重点</option><option value="1" ${t?.priority===1?'selected':''}>通常</option></select></div></div><div class="formgroup"><label>どこでつまずいた？</label><textarea name="symptom" rows="2" placeholder="例：再帰DNSと権威DNSの運用を混同">${esc(t?.symptom||'')}</textarea></div><div class="formgroup"><label>出題元・発見元</label><input name="source" type="text" value="${esc(t?.source||'')}" placeholder="例：R6春 問2"></div><div class="formgroup"><label>技術の仕組み・説明</label><textarea name="concept" rows="3" placeholder="ここに技術の意味と仕組みをまとめる">${esc(t?.concept||'')}</textarea></div><div class="formgroup"><label>処理・攻撃の流れ</label><textarea name="flow" rows="2" placeholder="A → B → C">${esc(t?.flow||'')}</textarea></div><div class="formgroup"><label>攻撃者の視点</label><textarea name="attacker" rows="2">${esc(t?.attacker||'')}</textarea></div><div class="formgroup"><label>防御者の視点</label><textarea name="defender" rows="2">${esc(t?.defender||'')}</textarea></div><div class="formgroup"><label>試験答案のコツ</label><textarea name="examTip" rows="2">${esc(t?.examTip||'')}</textarea></div><div class="modal-foot"><button type="button" class="outline" data-action="close-modal">キャンセル</button><button class="primary" type="submit">${t?'変更を保存':'弱点を登録'}</button></div></form>`}
else if(type==='question'){const initialTopic=topic(id)?id:db.topics[0]?.id;html=`<div class="modal-head"><h2>演習問題を追加</h2>${close}</div><form id="question-form"><div class="formgroup"><label>関連する弱点</label><select name="topicId">${db.topics.map(t=>`<option value="${esc(t.id)}" ${t.id===initialTopic?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div class="formgroup"><label>問題形式</label><select name="type" id="questionType"><option value="write">記述・自己評価</option><option value="choice">4択・自動判定</option></select></div><div class="formgroup"><label>状況説明</label><textarea name="scenario" rows="2" placeholder="例：Webサーバでセッション管理をしている…"></textarea></div><div class="formgroup"><label>設問 *</label><textarea name="prompt" rows="3" required placeholder="何を問うか、具体的に記述"></textarea></div><div class="formgroup" id="writeFields"><label>模範答案 *</label><textarea name="model" rows="3" placeholder="答案の具体例"></textarea><p class="help">自動的な意味判定はせず、模範答案と比較して自己評価する形式です。</p><label style="margin-top:12px">採点キーワード（任意・読点区切り）</label><input type="text" name="keywords" placeholder="ログ, RDP, 制限"></div><div id="choiceFields" style="display:none"><div class="gridtwo">${['A','B','C','D'].map((x,i)=>`<div class="formgroup"><label>選択肢${x}</label><input type="text" name="opt${i}" placeholder="選択肢${x}"></div>`).join('')}</div><div class="formgroup"><label>正しい選択肢</label><select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div></div><div class="formgroup"><label>解説・理由</label><textarea name="explanation" rows="3"></textarea></div><div class="modal-foot"><button type="button" class="outline" data-action="close-modal">キャンセル</button><button type="submit" class="primary">問題を追加</button></div></form>`}
else if(type==='bulk')html=`<div class="modal-head"><h2>複数の弱点をまとめて追加</h2>${close}</div><p class="muted small">1行に1件。「用語｜分野｜つまずいたこと」の形式で書いてください。分野は後から変更可能です。</p><form id="bulk-form"><div class="formgroup"><textarea rows="9" name="list" placeholder="CSRF｜Web・アプリ｜CSRFトークンの意味\nログの真正性｜調査・運用｜署名検証と保管方法が不明\nTLS終端｜通信・ネットワーク｜プロキシの役割と混同" required></textarea></div><div class="modal-foot"><button type="button" class="outline" data-action="close-modal">キャンセル</button><button type="submit" class="primary">まとめて登録</button></div></form>`;
else if(type==='exam'){const a=id?db.attempts.find(x=>x.id===id):null;html=`<div class="modal-head"><h2>${a?'過去問結果を編集':'過去問結果を追加'}</h2>${close}</div><form id="exam-form"><input type="hidden" name="id" value="${esc(a?.id||'')}"><div class="gridtwo"><div class="formgroup"><label>年度（西暦）</label><input name="year" type="number" min="2019" max="2035" required value="${esc(a?.year||'2026')}"></div><div class="formgroup"><label>試験期</label><select name="season"><option ${a?.season==='春'?'selected':''}>春</option><option ${a?.season==='秋'?'selected':''}>秋</option></select></div></div><div class="gridtwo"><div class="formgroup"><label>問番号</label><input name="q" type="number" min="1" max="10" required value="${esc(a?.q||'1')}"></div><div class="formgroup"><label>予想得点（50点満点）</label><input name="score" type="number" min="0" max="50" value="${esc(a?.score??'')}"></div></div><div class="gridtwo"><div class="formgroup"><label>事前判断</label><select name="before">${['','選ぶ','迷う','見送る'].map(z=>`<option value="${z}" ${a?.before===z?'selected':''}>${z||'未記録'}</option>`).join('')}</select></div><div class="formgroup"><label>事後判断</label><select name="after">${['','選ぶ','迷う','見送る'].map(z=>`<option value="${z}" ${a?.after===z?'selected':''}>${z||'未記録'}</option>`).join('')}</select></div></div><div class="formgroup"><label>所要時間（分）</label><input type="number" name="minutes" min="1" max="500" value="${esc(a?.minutes||'')}"></div><div class="formgroup"><label>採点メモ</label><textarea name="note" rows="2">${esc(a?.note||'')}</textarea></div><div class="formgroup"><label>新たに発覚した弱点（1行1項目）</label><textarea name="weaknesses" rows="4" placeholder="その問題で新たに分からなかった用語や仕組みをここに書く"></textarea></div><div class="formgroup"><label class="checkline"><input type="checkbox" name="invalid" ${a?.invalid?'checked':''}>採点・フォームに不備があり比較から除外する</label></div><div class="modal-foot"><button type="button" class="outline" data-action="close-modal">キャンセル</button><button class="primary" type="submit">${a?'結果を更新':'結果を登録'}</button></div></form>`}
else if(type==='restore')html=`<div class="modal-head"><h2>バックアップの復元・初期化</h2>${close}</div><p class="muted small">復元は既存データを上書きします。先にJSONをダウンロードしておくと安心です。</p><div class="stack"><button class="outline" data-action="restore-file">JSONバックアップから全件復元</button><input type="file" id="restoreFile" accept=".json,application/json" style="display:none"><button class="outline danger-outline" data-action="reset-data">初期データに戻す（すべての学習記録を消去）</button></div>`;
else if(type==='json-merge')html=`<div class="modal-head"><h2>JSONテキストを取り込む</h2>${close}</div><div class="helpbox">部分データなら <code>{"topics":[...]}</code> や <code>{"questions":[...]}</code> の形式。トピックの項目はtitle・area・symptomなどを指定できます。</div><form id="json-form"><div class="formgroup" style="margin-top:15px"><label>JSONを貼り付け</label><textarea name="json" rows="13" placeholder='{"topics":[{"title":"CSRF","area":"Web・アプリ","symptom":"仕組みが曖昧","concept":"..."}]}'></textarea></div><div class="modal-foot"><button type="button" class="outline" data-action="close-modal">キャンセル</button><button class="primary" type="submit">検証して追加</button></div></form>`;
body.innerHTML=html;const modal=$('modal');if(!modal.open)modal.showModal()}
function closeModal(){$('modal').close();state.modal=null}
function mergeData(raw,replace=false){if(!raw||typeof raw!=='object')throw Error('JSON形式が不正です');if(replace){validateDB(raw);db=raw;return`バックアップを復元しました：${db.topics.length}件`}let itemCount=0;if(Array.isArray(raw.topics)){for(const rt of raw.topics){if(!rt||typeof rt!=='object'||!rt.title)continue;let t={id:String(rt.id||nextId('topic')),title:String(rt.title).slice(0,140),area:AREAS.includes(rt.area)?rt.area:'その他',priority:[1,2,3].includes(Number(rt.priority))?Number(rt.priority):3,source:String(rt.source||'外部取り込み'),symptom:String(rt.symptom||''),concept:String(rt.concept||''),flow:String(rt.flow||''),attacker:String(rt.attacker||''),defender:String(rt.defender||''),examTip:String(rt.examTip||''),mastery:Math.max(0,Math.min(100,Number(rt.mastery)||10)),due:rt.due&&/^\d{4}-\d{2}-\d{2}$/.test(rt.due)?rt.due:today(),last:rt.last||'',streak:Number(rt.streak)||0,reviews:Number(rt.reviews)||0,note:String(rt.note||''),custom:true};let idx=db.topics.findIndex(x=>x.id===t.id);if(idx<0)idx=db.topics.findIndex(x=>x.title===t.title);if(idx>=0){const old=db.topics[idx];db.topics[idx]={...old,...t,id:old.id}}else db.topics.push(t);itemCount++}}if(Array.isArray(raw.questions)){for(const rq of raw.questions){if(!rq||typeof rq!=='object'||!rq.prompt||!rq.topicId)continue;const q={id:String(rq.id||nextId('q')),topicId:String(rq.topicId),type:rq.type==='choice'?'choice':'write',scenario:String(rq.scenario||''),prompt:String(rq.prompt),options:Array.isArray(rq.options)?rq.options.map(String).slice(0,4):[],correct:Number.isInteger(rq.correct)?rq.correct:null,model:String(rq.model||''),keywords:Array.isArray(rq.keywords)?rq.keywords.map(String):[],explanation:String(rq.explanation||''),custom:true};if(!db.topics.some(t=>t.id===q.topicId))continue;if(q.type==='choice'&&(q.options.length!==4||q.correct===null||q.correct<0||q.correct>3))continue;const ix=db.questions.findIndex(x=>x.id===q.id);if(ix>=0)db.questions[ix]=q;else db.questions.push(q);itemCount++}}if(Array.isArray(raw.attempts)){for(const a of raw.attempts){if(!a||!a.year||!a.q)continue;const x={id:String(a.id||nextId('exam')),year:String(a.year),season:String(a.season||'春'),q:String(a.q),score:a.score===null?null:Number(a.score),before:String(a.before||''),after:String(a.after||''),minutes:a.minutes==null?null:Number(a.minutes),note:String(a.note||''),invalid:Boolean(a.invalid),date:a.date||today()};const ix=db.attempts.findIndex(z=>z.id===x.id);if(ix>=0)db.attempts[ix]=x;else db.attempts.push(x);itemCount++}}return`${itemCount}件を取り込みました`}
function download(filename,content,type){const a=document.createElement('a'),blob=new Blob([content],{type});a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function readImport(file,replace=false){if(!file)return;try{if(file.size>3e6)throw Error('ファイルが大きすぎます（3MB以内）');const x=JSON.parse(await file.text());const msg=mergeData(x,replace);save();closeModalIfOpen();render();toast(msg)}catch(e){alert('読み込みできませんでした：'+e.message)}}
function closeModalIfOpen(){if($('modal').open)closeModal()}
function makePrompt(){return `あなたは情報処理安全確保支援士・科目Bの学習コーチです。次の採点結果から、新しい弱点だけを抽出し、このオフライン学習アプリに取り込めるJSONを出力してください。コードフェンス以外の説明は別にしてください。形式：{ "topics": [{ "id":"topic-一意の識別子", "title":"用語や技術名", "area":"通信・ネットワーク | Web・アプリ | 攻撃と防御 | 調査・運用 | 認証・暗号 | 記述技術 | その他のいずれか", "priority":3, "source":"問題名", "symptom":"答案上の具体的な弱点", "concept":"技術を実務未経験者に説明", "flow":"処理・攻撃の流れ", "attacker":"攻撃者の視点", "defender":"防御者の視点", "examTip":"記述答案のポイント" }] }。誤情報を入れず、公式解答と答案のズレに基づき作成してください。存在しない情報は推測しないでください。既存の弱点名：${db.topics.map(t=>t.title).join('、')}。過去問採点結果：ここに貼り付けてください。`}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch(e){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('コピーしました')}catch(_){toast('コピーできませんでした')}ta.remove()}}
function recordRating(rating){const s=state.session;if(!s||!s.revealed)return;const q=s.list[s.index],t=topic(q.topicId);if(!t)return;const delta={again:-14,hard:2,good:12,easy:22}[rating]||0;t.mastery=Math.max(0,Math.min(100,(t.mastery||0)+delta));if(['good','easy'].includes(rating))t.streak=(t.streak||0)+1;else t.streak=0;t.reviews=(t.reviews||0)+1;t.last=today();const days=rating==='again'?0:rating==='hard'?1:rating==='good'?Math.min(30,[2,4,7,14,25,30][Math.min(t.streak-1,5)]):Math.min(60,[4,7,14,30,45,60][Math.min(t.streak-1,5)]);t.due=plusDays(days);const row={id:nextId('review'),date:new Date().toISOString(),topicId:q.topicId,questionId:q.id,correct:q.type==='choice'?s.correct:null,rating,answer:q.type==='choice'?q.options[s.selected]:s.answer,elapsed:Math.round((Date.now()-s.start)/1000)};db.reviews.push(row);s.results.push(row);s.index++;s.answer='';s.selected=null;s.revealed=false;s.correct=null;if(s.index>=s.list.length)s.complete=true;save();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;state.topicId=null;state.session=null;render();window.scrollTo(0,0);return}const topicBtn=e.target.closest('[data-topic]');if(topicBtn){state.topicId=topicBtn.dataset.topic;state.page='topics';state.session=null;render();window.scrollTo(0,0);return}const count=e.target.closest('[data-count]');if(count){state.practiceCount=Number(count.dataset.count);render();return}const btn=e.target.closest('[data-modal]');if(btn){showModal(btn.dataset.modal,btn.dataset.id);return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;if(a==='close-modal'){closeModal();return}if(a==='start-study'){selectSession();return}if(a==='end-study'){state.session=null;state.page='home';render();return}if(a==='back-topics'){state.topicId=null;render();return}if(a==='study-topic'){selectSession({topic:action.dataset.id});return}if(a==='study-question'){selectSession({question:action.dataset.id});return}if(a==='choice'){if(!state.session?.revealed){state.session.selected=Number(action.dataset.index);render()}return}if(a==='reveal'){const s=state.session,q=s.list[s.index];if(q.type==='write')s.answer=$('freeAnswer')?.value||'';s.correct=q.type==='choice'?s.selected===q.correct:null;s.revealed=true;render();return}if(a==='skip-question'){const s=state.session,q=s.list[s.index];const t=topic(q.topicId);if(t){t.due=today();save()}s.results.push({topicId:q.topicId,questionId:q.id,correct:null,rating:'again'});s.index++;s.selected=null;s.answer='';s.revealed=false;if(s.index>=s.list.length)s.complete=true;render();window.scrollTo(0,0);return}if(a==='rate'){recordRating(action.dataset.rate);return}if(a==='export'){download('SC_Field_Lab_backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('バックアップを書き出しました');return}if(a==='import-file'){$('importFile')?.click();return}if(a==='restore-file'){$('restoreFile')?.click();return}if(a==='copy-prompt'){copyText(makePrompt());return}if(a==='reset-data'){if(confirm('これまでの学習記録・追加した弱点・問題をすべて初期状態に戻します。よろしいですか？')){if(confirm('本当に初期化しますか？取り消せません。')){db=fresh();save();closeModalIfOpen();state={...state,page:'home',topicId:null,session:null};render();toast('初期化しました')}}return}});
document.addEventListener('change',e=>{if(e.target.id==='areaFilter'){state.area=e.target.value;render()}if(e.target.id==='priorityFilter'){state.priority=e.target.value;render()}if(e.target.id==='practiceArea'){state.practiceArea=e.target.value;render()}if(e.target.id==='questionType'){const choice=e.target.value==='choice';$('choiceFields').style.display=choice?'':'none';$('writeFields').style.display=choice?'none':''}if(e.target.id==='importFile')readImport(e.target.files?.[0],false);if(e.target.id==='restoreFile')readImport(e.target.files?.[0],true)});
document.addEventListener('input',e=>{if(e.target.id==='topicSearch'){const a=e.target.selectionStart;state.search=e.target.value;const old=document.activeElement;const container=$('root');let items=db.topics.filter(t=>(state.area==='すべて'||t.area===state.area)&&(state.priority==='すべて'||String(t.priority)===state.priority)&&((t.title+' '+t.symptom+' '+t.concept+' '+t.source).toLowerCase().includes(state.search.toLowerCase())));items.sort((a,b)=>b.priority-a.priority||a.mastery-b.mastery);const cards=container.querySelector('.cards');if(cards)cards.innerHTML=items.map(t=>`<div class="topiccard" data-topic="${esc(t.id)}"><div class="row between"><span class="tag">${esc(t.area)}</span><span class="chip ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span></div><h3>${esc(t.title)}</h3><div class="description">${esc(t.symptom||'')}</div><div class="meter"><span style="width:${t.mastery||0}%"></span></div><div class="foot"><span>習熟度 ${t.mastery||0}% ｜ ${questionsOf(t.id).length} 問</span><span>${(t.due||today())<=today()?'復習対象':'次回 '+esc(t.due)}</span></div></div>`).join('')||'<div class="empty">一致する弱点はありません。</div>';const counter=container.querySelector('.row.wrap.between .muted.small');if(counter)counter.textContent=`登録済み ${db.topics.length} 件 ／ 表示 ${items.length} 件`}});
document.addEventListener('submit',e=>{const form=e.target;const formId=form.getAttribute('id');if(!['topic-form','question-form','bulk-form','exam-form','topic-note-form','exam-date-form','json-form'].includes(formId))return;e.preventDefault();const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();try{if(formId==='topic-form'){const id=v('id'),t=id?topic(id):null;if(!v('title'))throw Error('弱点名を入力してください');if(t){Object.assign(t,{title:v('title'),area:v('area'),priority:Number(v('priority')),source:v('source'),symptom:v('symptom'),concept:v('concept'),flow:v('flow'),attacker:v('attacker'),defender:v('defender'),examTip:v('examTip')})}else{db.topics.push({id:nextId('topic'),title:v('title'),area:v('area'),priority:Number(v('priority')),source:v('source'),symptom:v('symptom'),concept:v('concept'),flow:v('flow'),attacker:v('attacker'),defender:v('defender'),examTip:v('examTip'),mastery:10,streak:0,reviews:0,due:today(),last:'',custom:true})}toast(t?'弱点を更新しました':'新しい弱点を登録しました')}
else if(formId==='question-form'){if(!v('prompt'))throw Error('設問を入力してください');let type=v('type');let opts=[v('opt0'),v('opt1'),v('opt2'),v('opt3')];if(type==='choice'&&opts.some(x=>!x))throw Error('4つの選択肢をすべて入力してください');if(type==='write'&&!v('model'))throw Error('記述問題には模範答案を入力してください');db.questions.push({id:nextId('q'),topicId:v('topicId'),type,scenario:v('scenario'),prompt:v('prompt'),options:type==='choice'?opts:[],correct:type==='choice'?Number(v('correct')):null,keywords:type==='write'?v('keywords').split(/[,、]/).map(s=>s.trim()).filter(Boolean):[],model:type==='write'?v('model'):'',explanation:v('explanation'),custom:true});toast('新しい演習問題を登録しました')}
else if(formId==='bulk-form'){const lines=v('list').split(/\r?\n/).filter(Boolean);let add=0;for(const line of lines){let parts=line.split(/[|｜\t]/).map(x=>x.trim());if(!parts[0])continue;let [title,area,symptom]=parts;if(db.topics.some(t=>t.title===title))continue;db.topics.push({id:nextId('topic'),title,area:AREAS.includes(area)?area:'その他',priority:3,source:'演習メモ',symptom:symptom||(AREAS.includes(area)?'':' '+(area||'')),concept:'',flow:'',attacker:'',defender:'',examTip:'',mastery:10,streak:0,reviews:0,due:today(),custom:true});add++}toast(`${add}件の弱点を追加しました`)}
else if(formId==='exam-form'){const id=v('id'),a=id?db.attempts.find(x=>x.id===id):null;const item={id:a?.id||nextId('exam'),year:v('year'),season:v('season'),q:v('q'),score:v('score')===''?null:Number(v('score')),before:v('before'),after:v('after'),minutes:v('minutes')===''?null:Number(v('minutes')),note:v('note'),invalid:!!fd.get('invalid'),date:today()};if(a)Object.assign(a,item);else db.attempts.push(item);const lines=v('weaknesses').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const title of lines){if(!db.topics.some(t=>t.title===title))db.topics.push({id:nextId('topic'),title,area:'その他',priority:3,source:`${item.year}${item.season} 問${item.q}`,symptom:'演習で理解不足を確認',concept:'',flow:'',attacker:'',defender:'',examTip:'',mastery:10,streak:0,reviews:0,due:today(),custom:true})}toast('過去問の結果を保存しました')}
else if(formId==='topic-note-form'){let t=topic(v('id'));if(t)t.note=v('note');toast('メモを保存しました')}
else if(formId==='exam-date-form'){db.examDate=v('examDate');toast('試験日を変更しました')}
else if(formId==='json-form'){const x=JSON.parse(v('json'));toast(mergeData(x,false))}
save();closeModalIfOpen();render()}catch(error){alert(error.message)}});
